<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Board — Gerardo Gotelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D1117;
    --panel:#151B23;
    --panel-2:#1B232D;
    --edge:#28323F;
    --text:#E4E8EC;
    --dim:#8A97A6;
    --faint:#5A6675;
    --live:#3FD68C;
    --hold:#F2B33D;
    --dead:#4A5563;
    --link:#5CC8E8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:0 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  header{
    padding:40px 0 28px;
    border-bottom:1px solid var(--edge);
    margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:10px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(30px,5vw,44px);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.05;
  }
  .sub{color:var(--dim);margin-top:10px;max-width:56ch;font-size:14px}

  .counts{
    display:flex;
    flex-wrap:wrap;
    gap:26px;
    margin-top:24px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .count b{
    display:block;
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    line-height:1.1;
  }
  .count span{color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
  .c-live b{color:var(--live)}
  .c-hold b{color:var(--hold)}
  .c-dead b{color:var(--dead)}

  .bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:22px;
  }
  .filt{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.09em;
    text-transform:uppercase;
    background:transparent;
    color:var(--dim);
    border:1px solid var(--edge);
    padding:7px 13px;
    cursor:pointer;
    border-radius:2px;
    transition:.14s;
  }
  .filt:hover{color:var(--text);border-color:var(--faint)}
  .filt[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
  .spacer{flex:1}
  .search{
    background:var(--panel);
    border:1px solid var(--edge);
    color:var(--text);
    padding:7px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    border-radius:2px;
    min-width:190px;
  }
  .search::placeholder{color:var(--faint)}
  .search:focus{outline:2px solid var(--link);outline-offset:1px}

  .daygroup{margin-bottom:34px}
  .daylabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--faint);
    padding-bottom:9px;
    border-bottom:1px solid var(--edge);
    margin-bottom:2px;
    display:flex;
    justify-content:space-between;
  }

  /* signature: patch-panel status rail down the left of every row */
  .row{
    display:grid;
    grid-template-columns:4px 1fr auto;
    gap:0 18px;
    align-items:start;
    background:var(--panel);
    border-bottom:1px solid var(--ink);
    padding:0;
    transition:background .14s;
  }
  .row:hover{background:var(--panel-2)}
  .rail{
    width:4px;
    align-self:stretch;
    background:var(--dead);
    transition:background .18s, box-shadow .18s;
  }
  .row[data-s="apply"] .rail{background:var(--live);box-shadow:0 0 11px -1px var(--live)}
  .row[data-s="maybe"] .rail{background:var(--hold);box-shadow:0 0 11px -1px var(--hold)}
  .row[data-s="applied"] .rail{background:var(--link);box-shadow:0 0 11px -1px var(--link)}
  .row[data-s="skip"] .rail{background:var(--dead)}
  .row[data-s="skip"] .body{opacity:.5}

  .body{padding:15px 0 15px 2px;min-width:0}
  .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:16.5px;
    letter-spacing:-.01em;
  }
  .title a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent}
  .title a:hover{color:var(--link);border-bottom-color:var(--link)}
  .title a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--dim);
    margin-top:5px;
    display:flex;
    flex-wrap:wrap;
    gap:5px 12px;
  }
  .meta .co{color:var(--text)}
  .cv{color:var(--link)}
  .note{color:var(--dim);font-size:13.5px;margin-top:7px;max-width:74ch}

  .acts{display:flex;gap:5px;padding:15px 16px 15px 0;flex-shrink:0}
  .act{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--edge);
    color:var(--faint);
    padding:5px 9px;
    cursor:pointer;
    border-radius:2px;
    transition:.14s;
  }
  .act:hover{color:var(--text);border-color:var(--faint)}
  .act[aria-pressed="true"]{color:var(--ink);background:var(--text);border-color:var(--text)}
  .row[data-s="applied"] .act.a-applied[aria-pressed="true"]{background:var(--link);border-color:var(--link)}
  .row[data-s="skip"] .act.a-skip[aria-pressed="true"]{background:var(--dead);border-color:var(--dead);color:var(--text)}

  .empty{
    padding:52px 20px;
    text-align:center;
    color:var(--faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    border:1px dashed var(--edge);
  }
  footer{
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid var(--edge);
    color:var(--faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:space-between;
  }
  footer button{
    background:none;border:none;color:var(--faint);
    font:inherit;cursor:pointer;text-decoration:underline;
  }
  footer button:hover{color:var(--text)}

  @media (max-width:720px){
    .row{grid-template-columns:4px 1fr}
    .acts{grid-column:2;padding:0 0 14px 2px}
    .body{padding-bottom:9px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>

  <h1>Job board</h1>
  <p class="sub">Roles found on the daily search, with the CV to send and where each one stands. Status is saved in this browser.</p>

    <div class="count"><b id="n-applied" style="color:var(--link)">0</b><span>Applied</span></div>
    <div class="count c-dead"><b id="n-skip">0</b><span>Skipped</span></div>
  </div>
</header>

<div class="bar">

  <span class="spacer"></span>
  <input class="search" id="q" type="search" placeholder="filter by title, company…" aria-label="Filter jobs">
</div>

<main id="list"></main>

<footer>
  <span id="stamp"></span>
  <button id="reset">Reset all statuses</button>
</footer>

</div>

  JOBS.forEach(j => tally[stateOf(j)]++);
  document.getElementById("n-apply").textContent = tally.apply;
  document.getElementById("n-maybe").textContent = tally.maybe;
  document.getElementById("n-applied").textContent = tally.applied;
  document.getElementById("n-skip").textContent = tally.skip;

  const q = query.trim().toLowerCase();
  const shown = JOBS.filter(j => {
    if (filter !== "all" && stateOf(j) !== filter) return false;
    if (q && !(j.t + " " + j.c + " " + j.l).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!shown.length){
    list.innerHTML = '<p class="empty">Nothing matches that filter. Clear the search or pick another status.</p>';
    return;
  }

  const days = [...new Set(shown.map(j => j.d))].sort().reverse();
  list.innerHTML = days.map(day => {
    const rows = shown.filter(j => j.d === day).map(j => {
      const st = stateOf(j);
      const btn = (k, txt) =>
        `<button class="act a-${k}" data-id="${encodeURIComponent(idOf(j))}" data-set="${k}" aria-pressed="${st===k}">${txt}</button>`;
      return `<article class="row" data-s="${st}">
        <div class="rail"></div>
        <div class="body">
          <h3 class="title"><a href="${j.u}" target="_blank" rel="noopener">${j.t}</a></h3>
          <div class="meta">
            <span class="co">${j.c}</span><span>${j.l}</span><span class="cv">CV: ${j.cv}</span>
          </div>
          <p class="note">${j.n}</p>
        </div>
        <div class="acts">${btn("applied","Applied")}${btn("maybe","Maybe")}${btn("skip","Skip")}</div>
      </article>`;
    }).join("");
    const n = shown.filter(j => j.d === day).length;
    return `<section class="daygroup">
      <div class="daylabel"><span>${fmtDay(day)}</span><span>${n} role${n===1?"":"s"}</span></div>
      ${rows}
    </section>`;
  }).join("");
}

document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest(".act");
  if (!b) return;
  const id = decodeURIComponent(b.dataset.id), want = b.dataset.set;
  const job = JOBS.find(j => idOf(j) === id);
  if (!job) return;
  saved[id] = (stateOf(job) === want) ? job.s : want;
  persist();
  render();
});

document.querySelectorAll(".filt").forEach(b => {
  b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".filt").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
});

document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });

document.getElementById("reset").addEventListener("click", () => {
  saved = {}; persist(); render();
});

document.getElementById("stamp").textContent =
  JOBS.length + " roles tracked · last search " + fmtDay("2026-08-05");

render();
</script>
</body>
</html>
