name: Daily job sync

on:
  schedule:
    # 20:00 UTC — 6am AEST / 7am AEDT in Sydney.
    # GitHub may delay scheduled runs under load; it is not a precise alarm.
    - cron: "0 20 * * *"
  workflow_dispatch:

# Needed so the job can push the regenerated files back to the branch.
permissions:
  contents: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch new listings and regenerate the board
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/sync-jobs.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data/jobs.json index.html)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json index.html
          git commit -m "Daily job sync: $(date -u +%Y-%m-%d)"
          git push
